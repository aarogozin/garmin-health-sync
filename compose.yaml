services:
  app:
    build: .
    image: garmin-health-sync:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - garmin-sync-data:/data
      - type: bind
        source: ${GARMIN_SYNC_ARCHIVE_HOST_DIR:?Run ./health-sync start to configure the private Markdown workspace.}
        target: /archive
        bind:
          create_host_path: false
    environment:
      GARMIN_SYNC_ARCHIVE_DIR: /archive
      GARMIN_SYNC_ARCHIVE_DISPLAY_PATH: ${GARMIN_SYNC_ARCHIVE_DISPLAY_PATH:-/archive}
      GARMIN_SYNC_HOST_BRIDGE_URL: ${GARMIN_SYNC_HOST_BRIDGE_URL:-}
      GARMIN_SYNC_HOST_BRIDGE_TOKEN: ${GARMIN_SYNC_HOST_BRIDGE_TOKEN:-}
    secrets:
      - garmin_sync_key
    restart: unless-stopped
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  garmin-sync-data:

secrets:
  garmin_sync_key:
    file: ${GARMIN_SYNC_SECRET_KEY_PATH:?Run ./health-sync start to create the private Docker key.}
