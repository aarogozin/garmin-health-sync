[project]
name = "garmin-health-sync"
version = "1.2.1"
description = "Local Garmin health dashboard, RENPHO body sync and private Markdown archive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["garmin", "renpho", "health", "fitness", "body-composition"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect==0.3.5",
    "keyring>=25.6,<26",
    "renpho-py==1.2.0",
    "flask==3.1.3",
    "reportlab==5.0.0",
    "pypdf==6.16.1",
    "cryptography>=50.0,<51",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/aarogozin/garmin-health-sync"
Repository = "https://github.com/aarogozin/garmin-health-sync"
Issues = "https://github.com/aarogozin/garmin-health-sync/issues"
Security = "https://github.com/aarogozin/garmin-health-sync/security/policy"

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-reportlab==4.5.1.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_sync"]
artifacts = ["src/garmin_sync/web_dist/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/garmin_sync/gui.py" = ["E501"]
"src/garmin_sync/body_report.py" = ["E501"]
"src/garmin_sync/weekly_report.py" = ["E501"]
"src/garmin_sync/weekly_pdf.py" = ["E501"]
"src/garmin_sync/weekly_web.py" = ["E501"]
"src/garmin_sync/ai_context.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["garmin_sync"]

[[tool.mypy.overrides]]
module = ["garminconnect.*", "renpho.*"]
ignore_missing_imports = true
