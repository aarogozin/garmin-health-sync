[project]
name = "garmin-health-sync"
version = "0.10.0"
description = "Local CLI for manually logging body composition and blood pressure to Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.5",
    "keyring>=25.6,<26",
    "renpho-py==1.2.0",
    "flask==3.1.3",
    "reportlab==5.0.0",
    "pypdf==6.16.1",
    "cryptography>=46.0,<47",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-reportlab==4.5.1.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_sync"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/garmin_sync/gui.py" = ["E501"]
"src/garmin_sync/body_report.py" = ["E501"]
"src/garmin_sync/weekly_report.py" = ["E501"]
"src/garmin_sync/weekly_pdf.py" = ["E501"]
"src/garmin_sync/weekly_web.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["garmin_sync"]

[[tool.mypy.overrides]]
module = ["garminconnect.*", "renpho.*"]
ignore_missing_imports = true
